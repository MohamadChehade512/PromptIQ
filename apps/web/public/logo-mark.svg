<svg xmlns="http://www.w3.org/2000/svg" viewBox="380 190 600 610" role="img" aria-label="Prompt IQ">
  <defs>
    <linearGradient id="piq-p" x1="397" y1="268" x2="893" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#01ccff"/>
      <stop offset="0.35" stop-color="#2782fe"/>
      <stop offset="0.7" stop-color="#834ffc"/>
      <stop offset="1" stop-color="#ac38fd"/>
    </linearGradient>
    <linearGradient id="piq-low" x1="397" y1="560" x2="720" y2="787" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2125d9"/>
      <stop offset="0.55" stop-color="#3c26ed"/>
      <stop offset="1" stop-color="#6a27fa"/>
    </linearGradient>
    <linearGradient id="piq-fold" x1="420" y1="380" x2="520" y2="787" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#001776"/>
      <stop offset="0.6" stop-color="#0029bc"/>
      <stop offset="1" stop-color="#011986"/>
    </linearGradient>
    <linearGradient id="piq-fade" x1="0" y1="500" x2="0" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="piq-fade-mask" maskUnits="userSpaceOnUse" x="380" y="190" width="600" height="610">
      <rect x="380" y="190" width="600" height="610" fill="url(#piq-fade)"/>
    </mask>
    <linearGradient id="piq-spark" x1="818" y1="207" x2="952" y2="337" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5530ef"/>
      <stop offset="1" stop-color="#6a3cf5"/>
